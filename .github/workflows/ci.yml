name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
  pull_request_review:

permissions:
  contents: read
  pull-requests: read

jobs:
  workbench-gates:
    name: workbench-gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - name: Checkout repository with LF line endings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install standalone pytest runner
        run: python -m pip install --upgrade pip pytest

      - name: Run standalone pytest suite under strict Python flags
        run: python -O -B -W error -m pytest -v

      - name: Verify Ring 0 profile invariants and deterministic blueprint compilation
        run: |
          python ./bin/mlos adapt --check --profile profiles/ux582hs-rtx3080-8gb.toml
          python ./bin/mlos adapt --check --profile profiles/vmtest-qemu-x86_64.toml
          python ./bin/mlos compile --profile profiles/ux582hs-rtx3080-8gb.toml --verify-dir blueprints/ux582hs-rtx3080-8gb
          python ./bin/mlos probe --json
